# Default OLLAMA_MODEL is none (no LLM calls). Example with Ollama: export OLLAMA_MODEL=llama3:latest
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OLLAMA_MODEL=${OLLAMA_MODEL:-none}
    ports:
      - "${APP_PORT:-4000}:4000"
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - MIX_ENV=prod
      - PORT=4000
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OLLAMA_HOST=localhost
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-none}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: 