name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read versions from .tool-versions
        id: versions
        run: |
          ELIXIR_LINE=$(grep '^elixir ' .tool-versions)
          ELIXIR_VERSION=$(echo "$ELIXIR_LINE" | cut -d' ' -f2 | cut -d'-' -f1)
          OTP_VERSION=$(echo "$ELIXIR_LINE" | cut -d' ' -f2 | sed 's/.*otp-//')
          NODE_VERSION=$(grep '^nodejs ' .tool-versions | cut -d' ' -f2)
          echo "elixir=$ELIXIR_VERSION" >> $GITHUB_OUTPUT
          echo "otp=$OTP_VERSION" >> $GITHUB_OUTPUT
          echo "node=$NODE_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run Credo
        run: mix credo --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read versions from .tool-versions
        id: versions
        run: |
          ELIXIR_LINE=$(grep '^elixir ' .tool-versions)
          ELIXIR_VERSION=$(echo "$ELIXIR_LINE" | cut -d' ' -f2 | cut -d'-' -f1)
          OTP_VERSION=$(echo "$ELIXIR_LINE" | cut -d' ' -f2 | sed 's/.*otp-//')
          NODE_VERSION=$(grep '^nodejs ' .tool-versions | cut -d' ' -f2)
          echo "elixir=$ELIXIR_VERSION" >> $GITHUB_OUTPUT
          echo "otp=$OTP_VERSION" >> $GITHUB_OUTPUT
          echo "node=$NODE_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

  deploy:
    name: Deploy to Gigalixir
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to Gigalixir remote
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
          GIGALIXIR_APP_NAME: ${{ secrets.GIGALIXIR_APP_NAME }}
        run: |
          ENCODED_EMAIL="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["GIGALIXIR_EMAIL"], safe=""))')"
          git remote add gigalixir "https://${ENCODED_EMAIL}:${GIGALIXIR_API_KEY}@git.gigalixir.com/${GIGALIXIR_APP_NAME}.git"
          git push --force gigalixir HEAD:refs/heads/main
